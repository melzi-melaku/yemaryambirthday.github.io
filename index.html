<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yemaryam's 8th Birthday</title>
<meta name="description" content="You're invited to Yemaryam's 8th birthday party — Sunday 22nd November at 11 AM, at our home in Ayat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Fredoka:wght@700&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e8178a;
    --pink-deep: #b80d68;
    --pink-soft: #ff7cc3;
    --ink: #2b2326;
    --cream: #efe6da;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
    background-color: var(--cream);
    /* soft draped-fabric look */
    background-image:
      radial-gradient(120% 60% at 10% 0%, rgba(255,255,255,.75), transparent 60%),
      linear-gradient(115deg, transparent 0 18%, rgba(160,135,110,.20) 24%, transparent 31%, rgba(255,255,255,.55) 38%, transparent 46%),
      linear-gradient(160deg, transparent 0 40%, rgba(150,125,100,.18) 52%, rgba(255,255,255,.5) 60%, transparent 70%),
      linear-gradient(100deg, transparent 0 62%, rgba(140,115,95,.16) 72%, rgba(255,255,255,.45) 80%, transparent 90%),
      radial-gradient(80% 50% at 90% 100%, rgba(170,145,120,.25), transparent 70%),
      linear-gradient(180deg, #f4ede4, #e8ddcf);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 64px;
  }

  /* ---------- card + envelope ---------- */
  .stage { position: relative; width: min(100%, 470px); margin: 0 auto; }
  .envelope {
    position: absolute;
    width: 78%; aspect-ratio: 1.15;
    right: -14%; bottom: -8%;
    background: linear-gradient(160deg, #f1e7dc, #e2d3c3);
    border-radius: 4px;
    transform: rotate(-8deg);
    box-shadow: 0 18px 40px rgba(90,70,50,.18);
    overflow: hidden;
  }
  .envelope::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(200deg, rgba(255,255,255,.55), transparent 60%);
    clip-path: polygon(0 0, 100% 0, 50% 58%);
  }
  .envelope::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(120,95,70,.10);
    clip-path: polygon(0 100%, 50% 52%, 100% 100%);
  }
  .card {
    position: relative;
    background: var(--card);
    aspect-ratio: 5 / 7;
    padding: 6% 7% 13%;
    transform: rotate(-4deg);
    box-shadow:
      0 1px 0 rgba(0,0,0,.04),
      0 25px 50px -12px rgba(80,60,40,.35),
      0 8px 18px rgba(80,60,40,.12);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .balloons { width: 108%; margin: 0 -4%; display: block; overflow: visible; }

  .pun { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 1%; position: relative; z-index: 1; }
  .pun-doodles { position: absolute; left: -4%; top: -6%; width: 108%; height: auto; z-index: -1; pointer-events: none; }
  .pun-small {
    font-weight: 700; font-size: clamp(11px, 3.2vw, 15px);
    letter-spacing: .3em; text-transform: uppercase; color: var(--pink-deep); margin-bottom: .5em;
  }
  .pun-script {
    font-family: "Sacramento", cursive; color: var(--pink);
    font-size: clamp(64px, 19vw, 100px); line-height: 1;
    margin: 0 0 -4%;
    text-shadow: 0 2px 0 rgba(255,255,255,.9), 0 4px 10px rgba(232,23,138,.18);
  }
  .photo {
    width: 22%; aspect-ratio: 1; object-fit: cover; border-radius: 50%;
    border: 3px solid var(--pink); padding: 3px; background: #fff;
    margin: 2% 0 1%;
  }
  .join {
    font-weight: 600; font-size: clamp(11px, 3vw, 14px);
    letter-spacing: .22em; margin-top: 1%;
  }
  .name {
    font-family: "Sacramento", cursive;
    color: var(--pink);
    font-size: clamp(40px, 12vw, 62px);
    line-height: 1.05;
    margin: 2% 0 7%;
    font-weight: 400;
  }
  .details {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    margin-top: auto;
  }
  .detail {
    padding: 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-weight: 600; font-size: clamp(9.5px, 2.7vw, 12.5px);
    line-height: 1.35; letter-spacing: .06em; text-transform: uppercase;
  }
  .detail + .detail { border-left: 1.5px solid var(--pink); }
  .detail svg { width: clamp(18px, 5vw, 24px); height: auto; color: var(--pink); }
  .detail a { color: inherit; text-decoration: none; }
  sup { font-size: .6em; }
  .nw { white-space: nowrap; letter-spacing: 0; }
  .detail, .unit { font-variant-numeric: lining-nums; }

  /* ---------- extras ---------- */
  .extras {
    width: min(100%, 470px);
    margin-top: 72px;
    text-align: center;
  }
  .extras h2 {
    font-family: "Sacramento", cursive; font-weight: 400;
    color: var(--pink); font-size: 44px; line-height: 1;
    margin-bottom: 14px;
  }
  .countdown { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .unit {
    background: rgba(255,255,255,.85);
    border-radius: 14px; padding: 12px 0 8px; width: 72px;
    box-shadow: 0 6px 18px rgba(80,60,40,.10);
  }
  .unit b {
    display: block; font-family: "Fredoka", sans-serif; font-size: 30px;
    color: var(--pink); line-height: 1;
  }
  .unit span { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .party-now { font-family: "Fredoka", sans-serif; color: var(--pink); font-size: 24px; }
  .buttons { display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 18px; border-radius: 999px;
    font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 17px;
    letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn-primary {
    background: linear-gradient(180deg, #ff4fae, var(--pink) 55%, var(--pink-deep));
    color: #fff; box-shadow: 0 10px 24px rgba(232,23,138,.35);
  }
  .btn-ghost { background: #fff; color: var(--pink); border: 1.5px solid var(--pink); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foot { margin-top: 26px; font-size: 15px; font-weight: 600; color: #6c5b52; letter-spacing: .04em; }

  @media (max-width: 420px) {
    body { padding-top: 32px; }
    .card { transform: rotate(-2deg); padding: 6% 5% 8%; }
    .detail { padding: 0 4px; letter-spacing: .03em; }
    .row2 { grid-template-columns: 1fr; }
    .unit { width: 64px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .bob { animation: bob 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .bob:nth-child(2) { animation-delay: -.8s; }
    .bob:nth-child(3) { animation-delay: -1.6s; }
    .bob:nth-child(4) { animation-delay: -2.4s; }
    .bob:nth-child(5) { animation-delay: -3.2s; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(1deg); } }
  }
</style>
</head>
<body>

<main class="stage">
  <div class="envelope" aria-hidden="true"></div>

  <article class="card" aria-label="Birthday invitation">
    <!-- "Time to Celebr" + EIGHT = celebrEIGHT -->
    <div class="pun" aria-label="Time to celebr-EIGHT">
      <svg class="pun-doodles" viewBox="0 0 600 170" aria-hidden="true" fill="none" stroke="#e8178a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- hearts -->
        <path d="M60 52c-4-6-13-3-11 4 1 4 11 11 11 11s10-7 11-11c2-7-7-10-11-4z"/>
        <path d="M548 112c-4-6-13-3-11 4 1 4 11 11 11 11s10-7 11-11c2-7-7-10-11-4z"/>
        <path d="M108 146c-3-4-9-2-8 3 1 3 8 8 8 8s7-5 8-8c1-5-5-7-8-3z"/>
        <path d="M455 24c-3-4-9-2-8 3 1 3 8 8 8 8s7-5 8-8c1-5-5-7-8-3z"/>
        <!-- stars -->
        <path d="M60 102l3 7 7 .6-5.4 4.6 1.7 7-6.3-3.8-6.3 3.8 1.7-7-5.4-4.6 7-.6z"/>
        <path d="M528 36l3 7 7 .6-5.4 4.6 1.7 7-6.3-3.8-6.3 3.8 1.7-7-5.4-4.6 7-.6z"/>
        <path d="M150 20l2.4 5.6 6 .5-4.6 3.9 1.4 5.9-5.2-3.2-5.2 3.2 1.4-5.9-4.6-3.9 6-.5z"/>
        <path d="M512 140l2.4 5.6 6 .5-4.6 3.9 1.4 5.9-5.2-3.2-5.2 3.2 1.4-5.9-4.6-3.9 6-.5z"/>
        <!-- sparkle lines flanking the title -->
        <path d="M196 14l7 9M210 8l1 11M224 12l-4 10"/>
        <path d="M376 12l4 10M390 8l-1 11M404 14l-7 9"/>
        <!-- crosses and dots -->
        <path d="M24 100v8M20 104h8M578 70v8M574 74h8M250 40v0M90 150v8M86 154h8M516 154v8M512 158h8"/>
        <circle cx="30" cy="30" r="2"/><circle cx="575" cy="24" r="2"/><circle cx="130" cy="80" r="2"/><circle cx="560" cy="160" r="2"/>
      </svg>
      <span class="pun-small">Time to</span>
      <span class="pun-script">Celebr</span>
    </div>
    <!-- Foil balloon letters -->
    <svg class="balloons" viewBox="-12 92 612 268" role="img" aria-label="EIGHT">
      <defs>
        <linearGradient id="foil" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#ff8fcf"/>
          <stop offset=".35" stop-color="#ff2f9e"/>
          <stop offset=".7" stop-color="#e3127f"/>
          <stop offset="1" stop-color="#a80a5c"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d0157a"/>
          <stop offset="1" stop-color="#8e0a4e"/>
        </linearGradient>
        <filter id="gloss" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
          <feSpecularLighting in="blur" surfaceScale="7" specularConstant="1.15" specularExponent="26" lighting-color="#ffffff" result="spec">
            <fePointLight x="220" y="-160" z="260"/>
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
          <feDiffuseLighting in="blur" surfaceScale="5" diffuseConstant="1" lighting-color="#ffffff" result="diff">
            <feDistantLight azimuth="235" elevation="55"/>
          </feDiffuseLighting>
          <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="shaded"/>
          <feComposite in="shaded" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0" result="lit"/>
          <feComposite in="lit" in2="SourceAlpha" operator="in" result="clipped"/>
          <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#8a1150" flood-opacity=".28"/>
        </filter>
        <!-- one balloon letter: rim, puffy body, dotted seam -->
        <symbol id="none"/>
      </defs>

      <!-- doodles -->
      <g fill="none" stroke="#e8178a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- hearts -->
        <path d="M30 150c-3-5-11-3-9 3 1 3 9 9 9 9s8-6 9-9c2-6-6-8-9-3z"/>
        <path d="M560 250c-4-6-13-3-11 4 1 4 11 11 11 11s10-7 11-11c2-7-7-10-11-4z"/>
        <path d="M545 300c-3-4-9-2-8 3 1 3 8 8 8 8s7-5 8-8c1-5-5-7-8-3z"/>
        <path d="M150 300c-2-3-7-2-6 2 .5 2 6 6 6 6s5-4 6-6c1-4-4-5-6-2z"/>
        <!-- stars -->
        <path d="M575 175l3 7 7 .6-5.4 4.6 1.7 7-6.3-3.8-6.3 3.8 1.7-7-5.4-4.6 7-.6z"/>
        <path d="M40 215l2.4 5.6 6 .5-4.6 3.9 1.4 5.9-5.2-3.2-5.2 3.2 1.4-5.9-4.6-3.9 6-.5z"/>
        <path d="M480 330l2 4.6 5 .4-3.8 3.2 1.2 4.9-4.4-2.7-4.4 2.7 1.2-4.9-3.8-3.2 5-.4z"/>
                <!-- tiny dots/crosses -->
        <path d="M95 330v8M91 334h8"/>
        <circle cx="230" cy="330" r="2"/><circle cx="390" cy="340" r="2"/><circle cx="585" cy="215" r="2"/>
      </g>

      <!-- strings -->
      <g fill="none" stroke="#e8178a" stroke-width="1.6" stroke-linecap="round">
        <path d="M75 232c-6 10 8 14 2 24s-12 12-4 22 6 14 0 24"/>
        <path d="M163 248c6 10-8 14-2 24s10 14 2 24 -4 14 4 22"/>
        <path d="M262 238c-6 10 8 14 2 24s-12 12-4 22 6 14 0 24"/>
        <path d="M383 246c6 10-8 14-2 24s10 14 2 24-4 14 4 22"/>
        <path d="M505 236c-6 10 8 14 2 24s-12 12-4 22 6 14 0 24"/>
      </g>
      <!-- knots -->
      <g fill="#c2106c">
        <path d="M70 230h10l-5 7z"/><path d="M158 246h10l-5 7z"/><path d="M257 236h10l-5 7z"/>
        <path d="M378 244h10l-5 7z"/><path d="M500 234h10l-5 7z"/>
      </g>

      <!-- letters -->
      <g font-family="Fredoka, 'Arial Rounded MT Bold', sans-serif" font-weight="700" font-size="158" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
        <g class="bob"><g transform="translate(75 228) rotate(-6)">
          <text fill="url(#rim)" stroke="url(#rim)" stroke-width="20">E</text>
          <text fill="url(#foil)" stroke="url(#foil)" stroke-width="14" filter="url(#gloss)">E</text>
          <text fill="none" stroke="#ffd2ea" stroke-width="1.6" stroke-dasharray="1 5" opacity=".9">E</text>
        </g></g>
        <g class="bob"><g transform="translate(163 244) rotate(3)">
          <text fill="url(#rim)" stroke="url(#rim)" stroke-width="20">I</text>
          <text fill="url(#foil)" stroke="url(#foil)" stroke-width="14" filter="url(#gloss)">I</text>
          <text fill="none" stroke="#ffd2ea" stroke-width="1.6" stroke-dasharray="1 5" opacity=".9">I</text>
        </g></g>
        <g class="bob"><g transform="translate(262 234) rotate(-4)">
          <text fill="url(#rim)" stroke="url(#rim)" stroke-width="20">G</text>
          <text fill="url(#foil)" stroke="url(#foil)" stroke-width="14" filter="url(#gloss)">G</text>
          <text fill="none" stroke="#ffd2ea" stroke-width="1.6" stroke-dasharray="1 5" opacity=".9">G</text>
        </g></g>
        <g class="bob"><g transform="translate(383 242) rotate(4)">
          <text fill="url(#rim)" stroke="url(#rim)" stroke-width="20">H</text>
          <text fill="url(#foil)" stroke="url(#foil)" stroke-width="14" filter="url(#gloss)">H</text>
          <text fill="none" stroke="#ffd2ea" stroke-width="1.6" stroke-dasharray="1 5" opacity=".9">H</text>
        </g></g>
        <g class="bob"><g transform="translate(505 232) rotate(-3)">
          <text fill="url(#rim)" stroke="url(#rim)" stroke-width="20">T</text>
          <text fill="url(#foil)" stroke="url(#foil)" stroke-width="14" filter="url(#gloss)">T</text>
          <text fill="none" stroke="#ffd2ea" stroke-width="1.6" stroke-dasharray="1 5" opacity=".9">T</text>
        </g></g>
      </g>
    </svg>


    <p class="join">JOIN US TO CELEBRATE</p>
    <h1 class="name">Yemaryam's Birthday</h1>

    <section class="details">
      <div class="detail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
          <path d="M7.5 13.5h1M11.5 13.5h1M15.5 13.5h1M7.5 17h1M11.5 17h1"/>
        </svg>
        <span>Sunday<br>22<sup>nd</sup> November<br>11:00 AM</span>
      </div>
      <div class="detail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>
        </svg>
        <a href="https://maps.app.goo.gl/Mwk9fYMNXcX4PHZF9" target="_blank" rel="noopener">Our Home<br>Ayat<br>Addis Ababa</a>
      </div>
      <div class="detail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/>
        </svg>
        <a href="tel:+251911227230">RSVP to Mom<br><span class="nw">+251 911 227 230</span></a>
      </div>
    </section>
  </article>
</main>

<section class="extras">
  <h2>Counting down</h2>
  <div class="countdown" id="countdown" aria-live="polite">
    <div class="unit"><b id="cd-d">0</b><span>Days</span></div>
    <div class="unit"><b id="cd-h">0</b><span>Hours</span></div>
    <div class="unit"><b id="cd-m">0</b><span>Mins</span></div>
    <div class="unit"><b id="cd-s">0</b><span>Secs</span></div>
  </div>

  <div class="buttons">
    <a class="btn btn-primary" href="https://wa.me/251911227230?text=Hi!%20We'd%20love%20to%20come%20to%20Yemaryam's%208th%20birthday%20on%20Sunday%2022%20November%20at%2011am%20%F0%9F%8E%88" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>
      RSVP on WhatsApp
    </a>
    <div class="row2">
      <a class="btn btn-ghost" href="tel:+251911227230">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        Call Mom
      </a>
      <a class="btn btn-ghost" href="https://maps.app.goo.gl/Mwk9fYMNXcX4PHZF9" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Directions
      </a>
    </div>
  </div>
  <p class="foot">Can't wait to celebrate with you!</p>
</section>

<script>
  // Party: Sunday 22 November 2026, 11:00 AM Addis Ababa time (UTC+3)
  const PARTY = new Date("2026-11-22T11:00:00+03:00").getTime();
  const el = id => document.getElementById(id);
  function tick() {
    let s = Math.floor((PARTY - Date.now()) / 1000);
    if (s <= 0) {
      el("countdown").innerHTML = '<p class="party-now">It\'s party day! 🎈</p>';
      clearInterval(timer);
      return;
    }
    el("cd-d").textContent = Math.floor(s / 86400); s %= 86400;
    el("cd-h").textContent = Math.floor(s / 3600); s %= 3600;
    el("cd-m").textContent = Math.floor(s / 60);
    el("cd-s").textContent = s % 60;
  }
  const timer = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
