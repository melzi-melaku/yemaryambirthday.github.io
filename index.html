<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yemaryam's 8th Birthday</title>
<meta name="description" content="You're invited to Yemaryam's 8th birthday party — Sunday 22nd November from 1 to 4 PM, at our home in Ayat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Dancing+Script:wght@600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3f86d4;
    --blue-deep: #2b5fb8;
    --peri: #5b6fd6;
    --pink: #f27fb2;
    --pink-soft: #fbd3e5;
    --sky: #cfe7fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh;
    font-family: "Bubblegum Sans", "Fredoka", sans-serif;
    color: var(--peri);
    background: linear-gradient(160deg, #fde3ef 0%, #f6eefa 45%, #dcecfb 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 56px;
    position: relative;
  }
  /* soft blurred copy of the artwork behind everything */
  body::before {
    content: ""; position: fixed; inset: -60px; z-index: -1;
    background: url("bg.jpg") center / cover no-repeat;
    filter: blur(40px) saturate(1.1); opacity: .55;
  }

  /* ---------- the card ---------- */
  .card {
    container-type: inline-size;
    position: relative;
    width: min(100%, 440px);
    aspect-ratio: 702 / 1251;
    border-radius: 6%/3.4%;
    overflow: hidden;
    background: #fbe1ec;
    box-shadow: 0 30px 60px -18px rgba(70, 60, 140, .35), 0 8px 20px rgba(242, 127, 178, .18);
  }
  /* the supplied artwork has a white frame; this crops it off */
  .card > .bg {
    position: absolute;
    width: 110.54%; height: auto;
    left: -5.27%; top: -1.04%;
    pointer-events: none; user-select: none;
  }
  .layer { position: absolute; left: 0; right: 0; text-align: center; }

  .name {
    top: 27.7%;
    transform: translateY(-50%) rotate(-1.5deg);
    font-family: "Bubblegum Sans", sans-serif;
    font-size: 8.2cqw; line-height: 1;
    letter-spacing: .02em;
    color: var(--blue);
    text-shadow: 0 .35cqw 0 #fff, 0 .8cqw 1.6cqw rgba(43, 95, 184, .25);
  }

  .eight { top: 37%; display: flex; justify-content: center; }
  .eight svg { width: 42cqw; height: auto; overflow: visible; }

  .welcome {
    top: 53.1%;
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: 8.4cqw; line-height: 1;
    background: linear-gradient(90deg, #2e9ad8, #4f78d8 60%, #6a6fd6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .3cqw 0 rgba(255,255,255,.9));
  }

  .details {
    top: 58.1%; left: 4%; right: 4%;
    display: grid; grid-template-columns: 1.15fr .85fr 1.15fr;
    align-items: stretch;
  }
  .detail {
    display: flex; flex-direction: column; align-items: center;
    gap: .8cqw;
    font-size: 3.9cqw; line-height: 1.12;
    text-transform: uppercase; letter-spacing: .02em;
    color: var(--peri);
    text-shadow: 0 .25cqw 0 rgba(255,255,255,.8);
    min-height: 0;
  }
  .detail + .detail {
    background-image: radial-gradient(circle, #fff 45%, transparent 50%);
    background-size: 1.3cqw 2.6cqw;
    background-repeat: repeat-y;
    background-position: left top;
  }
  .detail svg { width: 8cqw; height: auto; filter: drop-shadow(0 .4cqw .6cqw rgba(140, 80, 120, .2)); }
  .detail .script {
    font-family: "Dancing Script", cursive; font-weight: 700;
    text-transform: none; font-size: 5.6cqw; line-height: .9; color: var(--peri);
  }
  .detail .big { font-size: 5cqw; line-height: 1.1; }
  .detail .script.small { font-size: 4.3cqw; line-height: .95; }
  .detail a { color: inherit; text-decoration: none; }

  .rsvp {
    top: 75.6%;
    display: flex; flex-direction: column; align-items: center; gap: .5cqw;
  }
  .dropoff {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: 3.8cqw; line-height: 1.05; color: #4b63cf;
    text-shadow: 0 .25cqw 0 rgba(255,255,255,.9);
  }
  .rsvp a {
    font-size: 3.5cqw; letter-spacing: .05em; text-transform: uppercase;
    color: var(--peri); text-decoration: none;
    background: rgba(255, 255, 255, .72);
    padding: .5cqw 3cqw; border-radius: 99px;
    font-variant-numeric: lining-nums;
  }

  /* ---------- below the card ---------- */
  .extras { width: min(100%, 440px); margin-top: 40px; text-align: center; }
  .extras h2 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: 40px; line-height: 1; margin-bottom: 14px;
    background: linear-gradient(90deg, #2e9ad8, #6a6fd6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .countdown { display: flex; justify-content: center; gap: 10px; margin-bottom: 26px; }
  .unit {
    background: rgba(255, 255, 255, .85);
    border-radius: 16px; padding: 12px 0 8px; width: 72px;
    box-shadow: 0 6px 18px rgba(91, 111, 214, .14);
    border: 2px dotted #f6b3d1;
  }
  .unit b { display: block; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 30px; color: var(--blue); line-height: 1; }
  .unit span { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--peri); }
  .party-now { font-family: "Dancing Script", cursive; font-weight: 700; font-size: 32px; color: var(--blue); }
  .buttons { display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 18px; border-radius: 999px;
    font-family: "Bubblegum Sans", sans-serif; font-size: 20px; letter-spacing: .06em;
    text-transform: uppercase; text-decoration: none;
    transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn-primary {
    background: linear-gradient(180deg, #6fb4f0, var(--blue) 55%, var(--blue-deep));
    color: #fff; box-shadow: 0 10px 24px rgba(63, 134, 212, .35);
  }
  .btn-ghost { background: rgba(255,255,255,.9); color: #e0609b; border: 2px solid #f6a8cb; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foot { margin-top: 24px; font-size: 18px; color: var(--peri); }
  @media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } .unit { width: 64px; } }

  @media (prefers-reduced-motion: no-preference) {
    .float { animation: float 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .float.b2 { animation-delay: -1.5s; } .float.b3 { animation-delay: -3s; }
    @keyframes float { 50% { transform: translateY(-3%) rotate(2deg); } }
  }
</style>
</head>
<body>

<main class="card" aria-label="Birthday invitation">
  <img class="bg" src="bg.jpg" alt="">

  <!-- name on the scroll -->
  <h1 class="layer name">YEMARYAM</h1>

  <!-- big glossy 8 with balloons -->
  <div class="layer eight" aria-label="Turning 8">
    <svg viewBox="0 0 300 200" aria-hidden="true">
      <defs>
        <linearGradient id="blueFoil" x1="0" y1="0" x2=".4" y2="1">
          <stop offset="0" stop-color="#bfe3ff"/>
          <stop offset=".35" stop-color="#6aaef0"/>
          <stop offset=".75" stop-color="#3f7fd6"/>
          <stop offset="1" stop-color="#2a55b0"/>
        </linearGradient>
        <linearGradient id="blueRim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a72c8"/><stop offset="1" stop-color="#22449a"/>
        </linearGradient>
        <filter id="gloss" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
          <feSpecularLighting in="blur" surfaceScale="7" specularConstant="1.2" specularExponent="24" lighting-color="#ffffff" result="spec">
            <fePointLight x="100" y="-80" z="220"/>
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
          <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".95" k4="0" result="lit"/>
          <feComposite in="lit" in2="SourceAlpha" operator="in"/>
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a3f8a" flood-opacity=".3"/>
        </filter>
        <radialGradient id="balPink" cx=".35" cy=".3" r=".75">
          <stop offset="0" stop-color="#ffd0e6"/><stop offset=".45" stop-color="#ff6fb0"/><stop offset="1" stop-color="#d93b86"/>
        </radialGradient>
        <radialGradient id="balYellow" cx=".35" cy=".3" r=".75">
          <stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#ffd84a"/><stop offset="1" stop-color="#e6a91c"/>
        </radialGradient>
        <radialGradient id="balCyan" cx=".35" cy=".3" r=".75">
          <stop offset="0" stop-color="#e0fbff"/><stop offset=".45" stop-color="#5fd6ee"/><stop offset="1" stop-color="#2aa3c7"/>
        </radialGradient>
      </defs>

      <!-- balloon strings -->
      <g fill="none" stroke="#9a8fc4" stroke-width="1.3" stroke-linecap="round">
        <path d="M222 92c-4 14 6 24 0 40s-12 24-20 34"/>
        <path d="M252 70c-2 20-14 34-26 54s-18 30-24 42"/>
        <path d="M272 98c-8 16-22 30-34 42s-26 18-36 26"/>
      </g>
      <!-- balloons -->
      <g class="float"><ellipse cx="222" cy="66" rx="20" ry="25" fill="url(#balPink)"/><path d="M218 90h8l-4 6z" fill="#d93b86"/></g>
      <g class="float b2"><ellipse cx="252" cy="44" rx="19" ry="24" fill="url(#balYellow)"/><path d="M248 67h8l-4 6z" fill="#e6a91c"/></g>
      <g class="float b3"><ellipse cx="272" cy="74" rx="19" ry="24" fill="url(#balCyan)"/><path d="M268 97h8l-4 6z" fill="#2aa3c7"/></g>

      <!-- gift box -->
      <g transform="translate(190 158)">
        <rect x="0" y="10" width="32" height="26" rx="3" fill="#7fb7f2"/>
        <rect x="-2" y="4" width="36" height="9" rx="2.5" fill="#9cc9f7"/>
        <rect x="13" y="4" width="6" height="32" fill="#f27fb2"/>
        <path d="M16 4c-6-10-16-6-10 0zM16 4c6-10 16-6 10 0z" fill="#f27fb2"/>
      </g>
      <g transform="translate(228 168)">
        <rect x="0" y="6" width="22" height="20" rx="2.5" fill="#f9a8cc"/>
        <rect x="-1.5" y="2" width="25" height="7" rx="2" fill="#fcc2dc"/>
        <rect x="9" y="2" width="4.5" height="24" fill="#6aaef0"/>
      </g>

      <!-- the 8 -->
      <g font-family="Fredoka, sans-serif" font-weight="700" font-size="210" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
        <text x="120" y="190" fill="url(#blueRim)" stroke="url(#blueRim)" stroke-width="18">8</text>
        <text x="120" y="190" fill="url(#blueFoil)" stroke="url(#blueFoil)" stroke-width="12" filter="url(#gloss)">8</text>
        <text x="120" y="190" fill="none" stroke="#e6f4ff" stroke-width="1.6" stroke-dasharray="1 5" opacity=".9">8</text>
      </g>

      <!-- sparkles -->
      <g fill="#fff" stroke="#f6a8cb" stroke-width="1">
        <path d="M40 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
        <path d="M190 20l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
        <path d="M30 140l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
      </g>
    </svg>
  </div>

  <p class="layer welcome">Join us to celebrate!</p>

  <section class="layer details">
    <div class="detail">
      <!-- calendar -->
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <rect x="6" y="12" width="48" height="42" rx="5" fill="#fff8f3" stroke="#e98a6a" stroke-width="2"/>
        <rect x="6" y="12" width="48" height="11" rx="5" fill="#f9b48f"/>
        <g fill="#f3c9b6"><rect x="12" y="28" width="7" height="5" rx="1"/><rect x="22" y="28" width="7" height="5" rx="1"/><rect x="32" y="28" width="7" height="5" rx="1"/><rect x="42" y="28" width="7" height="5" rx="1"/><rect x="12" y="37" width="7" height="5" rx="1"/><rect x="22" y="37" width="7" height="5" rx="1"/><rect x="32" y="37" width="7" height="5" rx="1" fill="#f27fb2"/><rect x="42" y="37" width="7" height="5" rx="1"/><rect x="12" y="46" width="7" height="4" rx="1"/><rect x="22" y="46" width="7" height="4" rx="1"/></g>
        <g fill="none" stroke="#c98d4a" stroke-width="2.4" stroke-linecap="round"><path d="M15 8v8M25 8v8M35 8v8M45 8v8"/></g>
      </svg>
      <span class="script">Sunday</span>
      <span>22 November</span>
    </div>
    <div class="detail">
      <!-- alarm clock -->
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="16" cy="13" r="7" fill="#f6b6a0"/><circle cx="44" cy="13" r="7" fill="#f6b6a0"/>
        <path d="M18 52l-4 5M42 52l4 5" stroke="#c98d4a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="30" cy="33" r="20" fill="#f9d9b8" stroke="#e98a6a" stroke-width="2.5"/>
        <circle cx="30" cy="33" r="15" fill="#fffaf4"/>
        <path d="M30 22v11l7 5" fill="none" stroke="#c0605a" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="30" cy="33" r="1.8" fill="#c0605a"/>
      </svg>
      <span class="script small">Drop your<br>little one</span>
      <span class="big">1:00 PM<br>– 4:00 PM</span>
    </div>
    <div class="detail">
      <!-- map pin -->
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <path d="M30 56s16-17 16-30a16 16 0 0 0-32 0c0 13 16 30 16 30z" fill="#f48fb6"/>
        <path d="M30 56s16-17 16-30a16 16 0 0 0-8-13.8C42 22 34 40 30 56z" fill="#e66a9e" opacity=".6"/>
        <circle cx="30" cy="26" r="6.5" fill="#fff"/>
      </svg>
      <a href="https://maps.app.goo.gl/Mwk9fYMNXcX4PHZF9" target="_blank" rel="noopener">Our Home<br>Ayat<br>Addis Ababa</a>
    </div>
  </section>

  <div class="layer rsvp"><a href="tel:+251911227230">RSVP to Mom · +251 911 227 230</a></div>
</main>

<section class="extras">
  <h2>Counting down</h2>
  <div class="countdown" id="countdown" aria-live="polite">
    <div class="unit"><b id="cd-d">0</b><span>Days</span></div>
    <div class="unit"><b id="cd-h">0</b><span>Hours</span></div>
    <div class="unit"><b id="cd-m">0</b><span>Mins</span></div>
    <div class="unit"><b id="cd-s">0</b><span>Secs</span></div>
  </div>
  <div class="buttons">
    <a class="btn btn-primary" href="https://wa.me/251911227230?text=Hi!%20We'd%20love%20to%20come%20to%20Yemaryam's%208th%20birthday%20on%20Sunday%2022%20November%20from%201%E2%80%934pm%20%F0%9F%8E%88" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.700-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>
      RSVP on WhatsApp
    </a>
    <div class="row2">
      <a class="btn btn-ghost" href="tel:+251911227230">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        Call Mom
      </a>
      <a class="btn btn-ghost" href="https://maps.app.goo.gl/Mwk9fYMNXcX4PHZF9" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Directions
      </a>
    </div>
  </div>
  <p class="foot">Can't wait to celebrate with you!</p>
</section>

<script>
  // Party: Sunday 22 November 2026, 1:00 PM Addis Ababa time (UTC+3)
  const PARTY = new Date("2026-11-22T13:00:00+03:00").getTime();
  const el = id => document.getElementById(id);
  function tick() {
    let s = Math.floor((PARTY - Date.now()) / 1000);
    if (s <= 0) {
      el("countdown").innerHTML = '<p class="party-now">It\'s party day! 🎈</p>';
      clearInterval(timer);
      return;
    }
    el("cd-d").textContent = Math.floor(s / 86400); s %= 86400;
    el("cd-h").textContent = Math.floor(s / 3600); s %= 3600;
    el("cd-m").textContent = Math.floor(s / 60);
    el("cd-s").textContent = s % 60;
  }
  const timer = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
